      as the 33 files that changed or were added since v1.1.0; of the other
      103, 29 are byte-identical to the retained v1.1.0 tree
      (kleddamag-n17-4640020-2026) and 74 to the v1.0.0 tree
      (kleddamag-n17-2026), and the three packets together pass the release's
      own 135-file manifest check. Both complete source checkers of
      bounds/4.66001/verify.py passed here, with check_integrity.py and
      controls.py. Registered at V4/C3; the native parent-core route cannot
      represent the weighted-threshold and winning-subset features, so no
      method-distinct C4 is claimed.
