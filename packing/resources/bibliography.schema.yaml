$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:Bibliography/v1
title: Bibliography
description: >-
  The fields a citation line is built from, keyed by the source keys the frontier
  records use, and the surname each credited name is cited under. README.md in this
  directory stays the human index of the same keys; the agreement between the two is
  checked by tests/test_bound_citations.py rather than by this schema.
type: object
additionalProperties: false
required: [last_reviewed, sources, credited_names]
properties:
  last_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [key, authors, year, venue]
      properties:
        # Spelled exactly as README.md defines it, brackets included.
        key: {type: string, pattern: '^\[.+\]$'}
        # Surnames as printed, in the source's order. A citation needs at least one.
        authors:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        # Null where the source carries no year, such as a maintained web page.
        year:
          oneOf:
            - {type: integer, minimum: 1900, maximum: 2100}
            - {type: 'null'}
        venue: {type: string, minLength: 1}
        # The source's own date, in UTC, for the version this project cites: the commit or
        # release date of the retained revision, else its published date. Required from the
        # year recent results begin; devtools.build_bound_citations stars a lower bound
        # whose source is dated on or after its RECENT_SINCE, and fails a source from that
        # year that carries no date rather than leaving its bound unstarred.
        dated: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        # The venue a line falls back to when this project's confirmation would not fit.
        short_venue: {type: string, minLength: 1}
        # Printed in place of the joined authors where the credit is joint with the lineage
        # the source builds on: last names or published handles, never an AI agent, and
        # every link the source names, however long that makes it. Printable ASCII, since
        # the stage sets citations in Latin faces and counts them against a fixed width;
        # devtools.build_bound_citations fails a credit whose line `credit year, venue` is
        # wider than that stage's 66 characters unless `short_credit` fits instead.
        credit: {type: string, minLength: 1, maxLength: 200, pattern: '^[ -~]+$'}
        # The stage's fallback where the whole credit does not fit its line: the credit's
        # authors, `after`, a proper prefix of its links, and `et al.`. The atlas stage
        # alone prints it; every other renderer prints `credit`. The shape is checked by
        # devtools.build_bound_citations, which fails anything else.
        short_credit: {type: string, minLength: 1, maxLength: 58, pattern: '^[ -~]+ et al\.$'}
        lineage:
          enum: [builds-on-project, credits-project, independent]
          description: >-
            How the source stands to this project, as the source itself says:
            `builds-on-project` when it credits this project's certificates, data or
            pipeline, `credits-project` when it credits this project only as
            inspiration or second-hand and brings its own method, `independent`
            otherwise. Typed because `credit` is prose that no tool parses; required by
            `devtools.check_results` for every source a register result by others
            published since the project began cites, and held to `credit` by
            tests/test_results_register.py.
        ai_assistance:
          type: object
          additionalProperties: false
          required: [statement, quote, where]
          description: >-
            The source's own statement that AI assisted its work, where it makes one;
            absent where it makes none, whatever else is said about it elsewhere. An AI
            agent is never a credited author (epistemics.md, Parallel Projects and Their
            Credit), so this is the one place the record says it. `statement` is the
            sentence a case record, a register row or the overview repeats, in the source's
            own terms; `quote` is the source's own words, verbatim, which the statement
            contains and which a case record that has made the statement contains too;
            `where` is the retained file, repository-relative, in which the source says it.
            Keys that carry the same statement share it: devtools.state_ai_assistance
            reads its statements from here and writes them into the case records that cite
            the source.
          properties:
            statement: {type: string, minLength: 1}
            quote: {type: string, minLength: 1}
            where: {type: string, pattern: '^packing/resources/web/[^ ]+[^/ ]$'}
        # Where a web source's authors or year were read, since the README's Web Sources
        # table carries neither.
        note: {type: string, minLength: 1}
  credited_names:
    type: object
    minProperties: 1
    additionalProperties: {type: string, minLength: 1}
