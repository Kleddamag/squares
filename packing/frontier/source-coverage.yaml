      - E-n021-evand-5000-1001-report
      - E-n021-evand-5000-1001-source-replay
      - E-n013-evand-casefree-cover-report
    notes: >-
      Evan Daniel's repository, formerly evand/square-packing-12, at
      167d842cd27ba1451cb2833773ea930c80b9e65b, retained on 2026-09-27 with
      replay receipts; its CREDITS.md says the work was produced with an AI
      agent under human direction. The Rust angle-net verifier on the s(12) and s(21) certificates
      passed here at N = 6000, so s(12) >= 15680/3951 and s(21) >= 5000/1001
      are registered at V4/C3; this repository's native parent-core interval
      route then decided all 2,486 rows of the s(12) certificate, a second
      method, so s(12) is at V4/C4. s(32) = 6 is registered at V4/C3: the
      complete zeromargin.py re-sweep here certified all 7,200 roots of the D4
      region (D4 RECHECK CLEAN), every per-root census identical to the
      source's shipped record, and the 2026-09-27 review found no mathematical
      defect. Neither zmcheck sweep, the
      Lean build, the exhaustive xcheck.py passes nor the case-free s(13) cover
      was replayed. The source's s(11) >= 3040/797
      is below the verified 31/8 and is retained in the packet but not registered.
