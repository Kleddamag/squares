      It also separates the two cases for the first time. The retained side exceeds
      Trump's 1979 packing of eleven squares at 3.877084, so s(12) > s(11) strictly,
      by at least 0.082916. Monotonicity gives only s(12) >= s(11); the strict
      inequality did not follow from anything on record before, because n = 12's
      previous lower bound was s(11)'s own 3.788854 and sat below Trump's packing.
    scope:
