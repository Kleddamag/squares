# Sub-patterns certified infeasible on the n17 unique-state cover, and their admission.
# `devtools/census_n17_certified.py` reads this file. Its certified count uses only the
# entries marked `admitted`; a `pending` entry is a projection, reported on its own line.
# Every path is repository-relative. Admitting an entry means setting `status: admitted`
# and naming the document that admits it in `evidence`: since OR-16's amendment, the
# experiment record holding the full pass of a reviewed standing verifier. The census
# checks only that `evidence` exists. It is a pointer for readers, not a check; what
# admits an entry is its `verification`.
schema: n17-certified-sub-patterns/v3
design: ring-3-voronoi-8-tabbed-unique
# The certificate objects (about 112 MB of gzip) are hosted outside Git, listed with their
# sizes, SHA-256 and URLs in this manifest; each certificate directory keeps its small
# files. The count needs only the committed receipts; `--fetch` downloads the objects so
# the verifiers can run again.
data_manifest: packing/campaign/explorations/X048-session-168-pilots/certificates/hosted-data.yaml
# The standing verifiers, written separately from the producers, as reviews admitted them.
# Each entry's verification names the listing it ran under by `id`; `version` is the
# revision the review read, kept for the reader, and nothing resolves it. A listing with
# `admits` may verify only the entries it names; the closed-cover listing says why the
# earlier kernel listings carry it. A verification is matched to its certificate by the
# content ids in the objects' file names (seed and node, or the manifest), not by
# directory, so a certificate directory can be renamed without verifying it again.
# Revisions named here were commits on PR 307's branch; they resolve at
# refs/pull/307/head.
verifiers:
  # The review verifiers: lane R3's for the kernel (W7's receipt), lane R4's for the
  # branch and bound (A's receipt).
  - id: kernel-review-r3
    certifier: kernel
    path: packing/devtools/verify_n17_kernel_certificate.py
    version: 556561586095f1eaf7952e32199f40a4d3360d20
    review: docs/project/reviews/review-2026-10-02-n17-w7-closure.md
    admits: [W7]
  - id: bb-review-r4
    certifier: branch-and-bound
    path: packing/devtools/verify_n17_bb_certificate.py
    version: 556561586095f1eaf7952e32199f40a4d3360d20
    review: docs/project/reviews/review-2026-10-02-n17-branch-and-bound-certifier.md
  # The kernel verifier on homogeneous integers with memoised partner covers, and the
  # branch-and-bound verifier with the 2,400-bit enclosure retry and the opt-in Taylor
  # checks, both admitted by the verifier-rewrites review of 2026-10-03.
  - id: kernel-homogeneous
    certifier: kernel
    path: packing/devtools/verify_n17_kernel_certificate.py
    version: e0b66f07b1d5daa04da0edc07dd591d7c17d9c47
    review: docs/project/reviews/review-2026-10-03-n17-verifier-rewrites.md
    admits: []  # no receipt in this ledger ran under this listing
  - id: bb-enclosure-retry
    certifier: branch-and-bound
    path: packing/devtools/verify_n17_bb_certificate.py
    version: ff5471e8902aeab0a9247501e9a3de380619d56a
    review: docs/project/reviews/review-2026-10-03-n17-verifier-rewrites.md
  # The kernel verifier on adaptive rows: a step's rows partition [0, 1] and each cites an
  # accepted row that contains it. Admitted by the same review's section 5 once its five
  # condition tests were committed (section 5.4).
  - id: kernel-adaptive-rows
    certifier: kernel
    path: packing/devtools/verify_n17_kernel_certificate.py
    version: 575795e029151abc52d892126acd05e23795641d
    review: docs/project/reviews/review-2026-10-03-n17-verifier-rewrites.md
    admits: []  # no receipt in this ledger ran under this listing
  # Only I/O and recording changed since the adaptive rows (no file-name read-back;
  # provenance for the module). Its mathematical checks are unchanged; the 47 condition
  # tests pass. SW9's and N1's receipts ran at fd2c9602e and ae4f5fb43, where the file is
  # this one (blob ea1c7104 in both receipts).
  - id: kernel-io-recording
    certifier: kernel
    path: packing/devtools/verify_n17_kernel_certificate.py
    version: 25c1cdef690f4c1d398364a13e3cf96281c01c17
    review: docs/project/reviews/review-2026-10-03-n17-verifier-rewrites.md
    admits: [SW9, N1]
  # The kernel verifier with exact point and segment covers (lane V1, after the n11
  # review's finding C2). Every earlier kernel listing accepts an uncovered zero-area row,
  # and those from the homogeneous one on also an uncovered one-point section. On W7, SW9
  # and N1 neither branch ran (review section 6.2), so their receipts stand, and each
  # earlier kernel listing admits only the entries whose receipts it wrote. A new entry
  # must be verified under this listing or a later one.
  - id: kernel-closed-covers
    certifier: kernel
    path: packing/devtools/verify_n17_kernel_certificate.py
    version: 318c28c42afaa4128c07dcbc785d717adbaf95a9
    review: docs/project/reviews/review-2026-10-03-n17-verifier-rewrites.md
  # The same verifier reading the node a step at a time, with its facet and
  # forbidden-region memos bounded (lane M1). Its checks are the closed-cover listing's;
  # it re-verifies W7, SW9 and N1 in full with their recorded receipts' fields.
  - id: kernel-streamed
    certifier: kernel
    path: packing/devtools/verify_n17_kernel_certificate.py
    version: 601bbf1107a622b306a3fe1fc57faebc9e28d27f
    review: docs/project/reviews/review-2026-10-04-n17-streamed-verifier.md
