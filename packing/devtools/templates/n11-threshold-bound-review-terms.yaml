# The term registry of Part II, "A Review of the Certified Lower Bound s(11) > 31/8 for
# 11 Squares", in the form the series' define-before-use gate reads
# (plan-2026-10-05-n11-explainer-series.md, section 9.4; the scanner is
# `devtools.paper_terms`). One entry per term, symbol or lemma, in definition order, which
# is the plan's concept spine (section 5.3). Fields:
#
#   term        the name, as the glossary lists it
#   uses        a regex matched against the rendered prose, or against the TeX source of
#               a formula when `symbol` is true, that counts as a use of the term
#   defined_by  an exact substring of the defining sentence, which occurs once, inside the
#               section `anchor` names; the bold run of the definition where there is one
#   anchor      the heading id of the defining section on the rendered page
#   requires    the terms a reader needs first; each is registered and defined earlier
#   forward     uses allowed before the definition, each an exact substring of the earlier
#               sentence with its reason: `roadmap` (the preamble, the result or the
#               inventory names a later concept), `heading` (a heading names it) or
#               `link-to-definition` (the sentence links the defining section)
#
# A lemma is a term whose definition is its bold name. The three changes of The Result
# are named there and defined later, so each carries its definition's section as a
# forward reference. The scanner skips credits, SVG, scripts, navigation and footnotes.

