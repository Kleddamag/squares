      Evan Daniel's repository, formerly evand/square-packing-12, at
      167d842cd27ba1451cb2833773ea930c80b9e65b, retained on 2026-09-27 with
      replay receipts; its CREDITS.md says the work was produced with an AI
      agent under human direction. The Rust angle-net verifier on the s(12) and s(21) certificates
      passed here at N = 6000, so s(12) >= 15680/3951 and s(21) >= 5000/1001
      are registered at V4/C3; this repository's native parent-core interval
      route then decided all 2,486 rows of the s(12) certificate, a second
      method, so s(12) is at V4/C4. s(32) = 6 is registered at V4/C4: the
      complete zeromargin.py re-sweep here certified all 7,200 roots of the D4
      region (D4 RECHECK CLEAN), every per-root census identical to the
      source's shipped record, and the 2026-09-27 review found no mathematical
      defect; on 2026-09-29 a complete run here of the source's zmx2, from the
      2026-09-28 release, on the same cover was recorded beside it as a second,
      interval-certified method (E-n032-evand-closed-cover-zmx2-replay, which
      states what the two checkers share). Neither zmcheck sweep, the Lean
      build nor the exhaustive xcheck.py passes were replayed, and the
      case-free s(13) cover only by zmx2. The source's s(11) >= 3040/797
      is below the verified 31/8 and is retained in the packet but not registered.
      On 2026-09-29 the same repository's s(21) = 5
      (evand-square-packing-2026-09-28) superseded its s(21) >= 5000/1001,
      which is kept as the previous verified bound. On 2026-10-02 zmx2's run on the s(32)
      cover without the D4 fold, from the checker source retained in
      evand-zmx2-sym-atoms-2026-09-30, was replayed here (E-n032-evand-zmx2-full-sym-replay).
