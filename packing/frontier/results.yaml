        family, or resolved disputed value". What is retained is not one bound but an
        eight-rung ladder -- 19/5, 77/20, 97/25, 39/10, 393/100, 197/50, 79/20, 99/25 -- by a
        generator that applies at every n and that has since produced the n = 11
