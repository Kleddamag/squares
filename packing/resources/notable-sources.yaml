softschema:
  contract: packing.squares:NotableSources/v1
  schema: notable-sources.schema.yaml
  status: enforced
last_reviewed: '2026-09-30'
# The notable websites and repositories on square packing, one entry per project or site,
# behind the overview's Other Square Packing Projects section and in the order it shows
# them: websites and catalogues, then releases, then repositories.
#
# Two lists meet here. Every source the research frontier reviews is in
# `frontier/source-coverage.yaml`, release by release; each belongs to exactly one entry
# below, under `coverage`, so a reviewed source can never drop off the page. The other
# entries are the major websites and notable repositories among the archive's retained
# Web Sources (`resources/README.md`), which is the reviewed list of retained sites.
#
# Credit is read, never restated: where a key is in `bibliography.yaml`, the card prints
# that key's `credit` (or its joined authors) whole, and `credit` here is refused. Only a
# source the bibliography does not carry states its credit here, read from the retained
# copy, with a `note` saying where. `devtools.check_notable_sources` holds all of it.
sources:
  - id: friedman-packing-center
    title: Packing Unit Squares in Squares
    kind: catalogue
    url: https://erich-friedman.github.io/papers/squares/squares.html
    keys: ['[Friedman Center]']
    credit: Friedman
    retained: packing/resources/web/friedman-packing-center-squares.md
    summary: >-
      Erich Friedman's page on packing unit squares in squares, on his Packing Center
      site, with record tables and diagrams of the best known packings.
    note: The retained capture's byline names Erich Friedman.
  - id: kingbird-squares-in-squares
    title: Squares in Squares
    kind: catalogue
    url: https://kingbird.myphotos.cc/packing/squares_in_squares.html
    keys: ['[Kingbird]']
    retained: packing/resources/web/kingbird-squares-in-squares.md
    coverage: [kingbird-current]
    summary: >-
      The maintained catalogue of the best known packings of unit squares in a square,
      with exact minimal polynomials and rigidity flags, continued by David Ellsworth from
      Friedman's original.
  - id: friedman-ds7-survey
    title: 'Packing Unit Squares in Squares: A Survey and New Results'
    kind: website
    url: https://www.combinatorics.org/files/Surveys/ds7/ds7v5-2009/ds7-2009.html
    keys: ['[Friedman DS7 html]']
    credit: Friedman
    retained: packing/resources/web/friedman-ds7-survey-2009-html.md
    summary: >-
      The 2009 HTML edition of Friedman's dynamic survey in the Electronic Journal of
      Combinatorics, with the history of the problem and proofs of its small cases.
    note: The retained capture's byline names Erich Friedman.
  - id: wikipedia-square-packing
    title: Square packing
    kind: website
    url: https://en.wikipedia.org/wiki/Square_packing
    keys: ['[Wikipedia]']
    credit: Wikipedia contributors
    retained: packing/resources/web/wikipedia-square-packing.md
    summary: >-
      Wikipedia's overview of square packing problems, among them packing unit squares in
      a square.
    note: A collectively written encyclopedia article, credited as Wikipedia credits one.
  - id: burns-n17-posts
    title: Sam Burns's seventeen-square series
    kind: website
    url: https://sam-burns.com/posts/n17-square-packing-problem-intro/
    keys: ['[Burns n17 addendum 2026-09-07]']
    credit: Burns
    retained: packing/resources/web/n17-lower-bounds-2026/
    summary: >-
      Sam Burns's blog series on packing seventeen unit squares: a weighted lower-bound
      certificate with its verifier, and a near-record arrangement of distinct topology.
    note: >-
      The posts are Burns's own, as the two packets retaining them say
      (web/n17-lower-bounds-2026/README.md and
      web/burns-n17-series-addendum-2026-09-07/README.md). The bibliography's
      [Burns–Massaccesi n17] credits Massaccesi's result on Burns's architecture, so it is
      the key of Massaccesi's card, not this one.
  - id: massaccesi-n17-posts
