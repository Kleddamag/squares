  project, the Schadt n=29 witness-contract regression source, and the September 2026
  external executable lower-bound certificate releases. Their proof obligations and
  assurance are tracked by evidence.yaml; paper availability remains in
  source-availability.yaml. This is a dated named-source claim, not a claim that a
  web search has exhausted every possible source.
