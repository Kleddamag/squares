# Every result report received as a GitHub issue, joined to the register.
#
# One entry per issue: what it reports, the register and evidence ids each reported
# result maps to (or why it is not registered), the beads that track it, every reply
# posted with the state it reported, and when it can close. Nothing here is a current
# rung: `devtools.check_requests` derives each result's state, whether a reply is due and
# whether the issue is closeable from this file and the register together. Process:
# campaign/result-import.md, stage 7.
#
# A reply is a comment by the owner, or one that ends in the Claude Code footer and is
# not by the issue's author. `read_through` is the latest comment read into the entry;
# `check_requests --github` lists anything later.
softschema:
  contract: packing.squares:ResultRequests/v1
  schema: schemas/result-requests.schema.yaml
  envelope: null
  status: enforced
