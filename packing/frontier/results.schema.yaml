$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:ResultsRegister/v1
title: ResultsRegister
description: >-
  First-party and load-bearing results classified on the four epistemic axes.
  The vocabulary is owned by epistemics.md at the repository root: V and C are
  declared here and re-derived from the cited evidence atoms by
  devtools/check_results.py, which fails on any declared rung the atoms do not
  support or understate; S is a judged, anchored, dated score that never
  gates; N adopts the evidence contract's novelty enum.
type: object
additionalProperties: false
required: [last_reviewed, results]
properties:
  last_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  results:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/result'}
$defs:
  scope:
    oneOf:
      - type: object
        additionalProperties: false
        required: [n_values]
        properties:
          n_values:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: integer, minimum: 1}
      - type: object
        additionalProperties: false
        required: [n_min, n_max]
        properties:
          n_min: {type: integer, minimum: 1}
          n_max: {type: integer, minimum: 1}
  significance:
    type: object
    additionalProperties: false
    required: [score, rationale, scored, by]
    properties:
      score: {type: integer, minimum: 1, maximum: 5}
      rationale: {type: string, minLength: 1}
      scored: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      by: {type: string, minLength: 1}
  result:
    type: object
    additionalProperties: false
    required:
      - id
      - headline
      - registered
      - claim
      - scope
      - verification
      - confirmation
      - significance
      - novelty
      - evidence
      - artifacts
      - next_rung
    # A result of this project carries the day it was established; a result by others
    # carries its source's date in attribution.published instead, and never both.
    if: {required: [attribution]}
    then: {not: {required: [established]}}
    else: {required: [established]}
    properties:
      id: {type: string, pattern: '^T-[0-9]{3}$'}
      headline:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^\S(.*\S)?$'
        description: >-
          The result stated short enough for a table cell, one line of inline Markdown
          with the mathematics in backticks. It keeps the claim's relation exactly (`≥`
          is not `>`), its exact form with the claim's decimal or a truncation of it
          marked `…`, and its n values, and states no number the claim does not; the
          checker holds it to that and to 100 characters. The claim stays the statement
          the rungs attach to.
      established:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        description: >-
          The day this result was first established in this repository: the day its
          certificate or proof first passed here, read from the commit that landed it.
          Required on every result without `attribution` and refused on one with it,
          whose date is `attribution.published`. Never before 22 August 2026, the day
          this project's square-packing work began.
      registered:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        description: >-
          The day this entry entered the register: the committing day, in UTC, of the
          commit that added it, on every result, this project's and others'. Distinct from
          `established`, the day a result of this project first passed here,
          `attribution.published`, the day a result by others entered its source, and
          `significance.scored`, the day of the current assessment. Never before either of
          the first two, nor after the register's last review. The entries that predate
          the field took it from git once (`devtools.backfill_registered`); a new entry
          states it when it is written.
      claim:
        type: string
        minLength: 1
        description: The one stated claim the levels attach to, in full.
      scope: {$ref: '#/$defs/scope'}
      verification:
        type: string
        enum: [V0, V1, V2, V3, V4, V5]
        description: Strongest verification existing anywhere; derived as the max any cited entry supports.
      confirmation:
        type: string
        enum: [C0, C1, C2, C3, C4, C5]
        description: What this repository established end-to-end; derived from the cited atoms per epistemics.md.
      significance: {$ref: '#/$defs/significance'}
      novelty:
        type: string
        enum: [common-knowledge, previously-published, apparently-novel, confirmed-novel]
      composition:
        type: string
        minLength: 1
        description: >-
          Required prose when the claim is compound or derived: names the
          load-bearing parts and which one sets the minimum, or the inputs a
          derived claim takes its minimum from.
      evidence:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^E-[a-z0-9-]+$'}
      artifacts:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
        description: Repository-relative paths of the certificates, cases, and documents the result rests on.
      controls:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
        description: >-
          Repository-relative paths of the adversarial-control tests behind a
          C3-or-better rung; the checker requires this field at those rungs and
          verifies the paths exist.
      review_artifact:
        type: string
        minLength: 1
        description: The C5 review document, when one exists; repository-relative.
      next_rung:
        type: string
        minLength: 1
        description: The next evidence-improving action, or why no independent rung change applies.
      notes: {type: string, minLength: 1}
      attribution:
        type: object
        additionalProperties: false
        required: [source_keys, published]
        description: >-
          Whose result this is, when it is not this project's. Required on every
          `previously-published` result and refused on `apparently-novel` and
          `confirmed-novel` ones. The keys resolve in `resources/bibliography.yaml`,
          which is the one home of the authors, the credit line and the lineage, so the
          credit on an original result is never restated here. `published` is the date
          the result entered its source, which can precede the date this record first
          saw it. The rungs stay this repository's: `V` is the strongest verification
          anywhere and `C` what this repository has done, so a result by others is
          registered when it is taken in and rises as the replay and review land.
        properties:
          source_keys:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, pattern: '^\[.+\]$'}
          published:
            type: string
            pattern: '^\d{4}(-\d{2}-\d{2})?$'
            description: A date, or a year alone for a source that carries no date.
      produced_by:
        type: object
        additionalProperties: false
        minProperties: 1
        description: >-
          The campaign records this result came out of, as ids the checker resolves
          to existing records and refuses when dangling. Every key is optional: a
          result names only the provenance the record itself states. Before this
          field existed the join ran through prose alone -- a `by:` line inside
          significance, cell ids inside next_rung -- which no ledger could read, so a
          hypothesis with a registered result standing on it reported as untouched.
        properties:
          hypothesis: {type: string, pattern: '^H-[0-9]{3}$'}
          agenda_cell: {type: string, pattern: '^BC-[0-9]{3}$'}
          session: {type: string, pattern: '^session-[0-9]{3}$'}
          experiment: {type: string, pattern: '^exp-[0-9]{3}$'}
