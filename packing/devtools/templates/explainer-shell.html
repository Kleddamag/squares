<!doctype html>
<html lang="en" data-kpress-viewport data-kpress-theme="system" data-kpress-resolved-theme="light"
      data-kpress-palette="neutral" data-kpress-prose-font="serif" data-kpress-math-text="prose"
      data-kpress-mono-font="{{MONO_FONT}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="kpress">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<!-- What a shared link shows. Everything the page itself loads is inlined or relative,
     because it has to open the same way from a file, from Pages and from an artifact
     host; these are the exception, and they are not loads. A crawler reads them off the
     markup with no base to resolve against, so each URL is absolute, and no browser
     fetches any of them to display the page. The image is the atlas composite served
     beside this file: portrait, so X and Facebook crop it to a band of the grid and
     Slack, Discord and iMessage scale all hundred packings down whole. The width and
     height are read from that PNG, so a consumer can reserve the box before it has the
     bytes. -->
<link rel="canonical" href="{{CANONICAL_URL}}">
{{SITE_FAVICON}}
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{CARD_IMAGE_URL}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{CARD_IMAGE_WIDTH}}">
<meta property="og:image:height" content="{{CARD_IMAGE_HEIGHT}}">
<meta property="og:image:alt" content="{{CARD_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
<meta name="twitter:image" content="{{CARD_IMAGE_URL}}">
<meta name="twitter:image:alt" content="{{CARD_ALT}}">
<style>{{KPRESS_CSS}}</style>
<!-- The relation, the approximation sign and the arrow, subset out of KaTeX_Main and
     declared on the sans families the page already ships. Source Sans 3 carries none of
     the three, so without these the reader's own machine draws them: a different face
     for every reader, and outline paths in the PDF. See `relation_face_css`. -->
<style>{{RELATION_CSS}}</style>
<!-- The text tokens every page of the site shares: type base, reading measure, heading
     scale, the paper's roles, and the site's own faces. See templates/paper-type.css. -->
<style>{{PAPER_TYPE_CSS}}</style>
<!-- The site's navigation bar, shared with every other page of the site and hidden in
     print. See templates/site-nav.css. -->
<style>{{SITE_NAV_CSS}}</style>
<script>{{THEME_BOOTSTRAP}}</script>
<script>{{SITE_EMBED}}</script>
<script>{{NATIVE_MATH_METRICS}}</script>
<style>{{PUBLICATION_CSS}}</style>
<style>
/* Print shows one certificate, always the one the page opens on, so a printed copy
   does not depend on what the reader last clicked. The rest of the page's styles
   are templates/explainer-publication.css, above; this rule stays here because it
   names the page's default certificate. */
@media print {
  .cert-figure[data-cert="{{DEFAULT_SLUG}}"][hidden] { display: block !important; }
  .cert-figure:not([data-cert="{{DEFAULT_SLUG}}"]) { display: none !important; }
}
</style>
</head>
<body>
<main class="kpress-page-main kpress-viewport">
{{SITE_NAV}}
<div class="kpress kpress-doc kpress-prose cert-page">
{{BODY_HTML}}
<p class="col colophon centred">{{COLOPHON}}</p>
</div>

</main>
<script>{{SITE_THEME}}</script>
<script>{{KATEX_JS}}</script>
<script>{{RESERVE_MATH}}</script>
<script>{{KPRESS_CLIENT_SCRIPT}}</script>
<script>{{DIAGRAM_LABEL_SCRIPT}}</script>
<script>{{EXPLAINER_PAGE_SCRIPT}}</script>
<!--BEGIN:SCRIPT-->
<script>{{CERTIFICATE_SCRIPT}}</script>
<!--END:SCRIPT-->
<script>{{FINISH_MATH}}</script>
</body>
</html>
