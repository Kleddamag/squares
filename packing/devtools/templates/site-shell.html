<!doctype html>
<html lang="en" data-kpress-viewport data-kpress-theme="system" data-kpress-resolved-theme="light"
      data-kpress-palette="neutral" data-kpress-prose-font="{{PROSE_FONT}}" data-kpress-math-text="prose"
      data-kpress-mono-font="{{MONO_FONT}}" data-site-page="{{PAGE_KEY}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="kpress">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<!-- The site's pages share this shell; the explainer keeps its own. The link-preview
     metadata carries absolute URLs, as the explainer's does: a crawler has no base to
     resolve a relative one against, and no browser fetches any of them to show the page.
     The design system these pages follow is written down in site-design.md. -->
<link rel="canonical" href="{{CANONICAL_URL}}">
<link rel="icon" href="{{FAVICON_HREF}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{CARD_IMAGE_URL}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{CARD_IMAGE_WIDTH}}">
<meta property="og:image:height" content="{{CARD_IMAGE_HEIGHT}}">
<meta property="og:image:alt" content="{{CARD_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
<meta name="twitter:image" content="{{CARD_IMAGE_URL}}">
<meta name="twitter:image:alt" content="{{CARD_ALT}}">
<style>{{KPRESS_CSS}}</style>
<style>{{RELATION_CSS}}</style>
<style>{{SITE_CSS}}</style>
<script>{{THEME_BOOTSTRAP}}</script>
<script>{{NATIVE_MATH_METRICS}}</script>
</head>
<body>
{{NAV_HTML}}
<main class="kpress-page-main kpress-viewport">
<div class="kpress kpress-doc kpress-prose site-page site-{{PAGE_KEY}}">
{{BODY_HTML}}
</div>
</main>
{{FOOTER_HTML}}
<!-- The repository links this page names on the default branch rather than the build
     commit; the published-site check accepts `main` for exactly these. Data, not code. -->
<script type="application/json" id="site-default-branch-links">{{DEFAULT_BRANCH_LINKS}}</script>
<script>{{KATEX_JS}}</script>
<script>{{RESERVE_MATH}}</script>
<script>{{KPRESS_CLIENT_SCRIPT}}</script>
{{PAGE_SCRIPTS}}
<script>{{SITE_MATH_SCRIPT}}</script>
<script>{{FINISH_MATH}}</script>
</body>
</html>
