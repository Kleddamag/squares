# Sub-patterns certified infeasible on the n17 unique-state cover, and their admission.
# `devtools/census_n17_certified.py` reads this file. Its certified count uses only the
# entries marked `admitted`; a `pending` entry is a projection, reported on its own line.
# Every path is repository-relative. Admitting an entry means setting `status: admitted`
# and naming the review document that admits it in `evidence`.
schema: n17-certified-sub-patterns/v2
design: ring-3-voronoi-8-tabbed-unique
# The standing verifiers, written separately from the producers, at the revisions a review
# admitted. An admitted entry counts only with a full, passing verification by a listed
# verifier at a listed revision, or at a later one at which its file is unchanged.
verifiers:
  # The review verifiers retained at 556561586: lane R3's for the kernel (W7's receipt),
  # lane R4's for the branch and bound (A's receipt).
  - path: packing/devtools/verify_n17_kernel_certificate.py
    revision: 556561586095f1eaf7952e32199f40a4d3360d20
    review: docs/project/reviews/review-2026-10-02-n17-w7-closure.md
  - path: packing/devtools/verify_n17_bb_certificate.py
    revision: 556561586095f1eaf7952e32199f40a4d3360d20
    review: docs/project/reviews/review-2026-10-02-n17-branch-and-bound-certifier.md
  # The kernel verifier on homogeneous integers with memoised partner covers (e0b66f07b),
  # and the branch-and-bound verifier with the 2,400-bit enclosure retry and the opt-in
  # Taylor checks (ff5471e89), both admitted by the verifier-rewrites review of 2026-10-03.
  - path: packing/devtools/verify_n17_kernel_certificate.py
    revision: e0b66f07b1d5daa04da0edc07dd591d7c17d9c47
    review: docs/project/reviews/review-2026-10-03-n17-verifier-rewrites.md
  - path: packing/devtools/verify_n17_bb_certificate.py
    revision: ff5471e8902aeab0a9247501e9a3de380619d56a
    review: docs/project/reviews/review-2026-10-03-n17-verifier-rewrites.md
  # The kernel verifier on adaptive rows (575795e02): a step's rows partition [0, 1] and
  # each cites an accepted row that contains it. Admitted by the same review's section 5
  # once its five condition tests were committed (056de341f; section 5.4).
  - path: packing/devtools/verify_n17_kernel_certificate.py
    revision: 575795e029151abc52d892126acd05e23795641d
    review: docs/project/reviews/review-2026-10-03-n17-verifier-rewrites.md
