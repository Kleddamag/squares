      One figure from the ladder is worth carrying, because it contradicts the obvious
      reading. Margin is not monotone in the side. The 451/100 rung two below this one
      has total 16.593620 and margin 0.406380 -- an order of magnitude more headroom at a
      side 0.08 lower -- and the 229/50 rung between them has margin 0.034265, half of
      what 459/100 has at a higher side. So the covering value at a given side is set by
      the site set at least as much as by the side itself, and a better site set at a
      higher side can open the margin back up rather than close it. The n = 12 ladder
      shows the same shape in the same direction: margin 0.007175 at 197/50, then
      0.029410 at the higher 79/20.

      Massaccesi's own atoms are the reference point and not a limit: they
      give a covering value of 203/12 at 4.5058, tight by construction, which bounds
      nothing about what a different site set reaches at a larger side.

      A further rung is therefore a search question, and the quantity to read is the
      restricted optimum a converged run reaches, never an extrapolated rate.

      One such question was asked and answered on 2026-09-04, at n = 18 and side
      117/25 = 4.68, and it is recorded here as measurement rather than as a claim about
      tau*. Three site sets in succession -- 538, 578 and 618 orbits -- returned a
      restricted optimum of exactly 18.000000, the third of them after 157 row-generation
      rounds that grew the row set from 15888 to 27516 and cost 7056 s. Adding sites can
      only lower a restricted optimum, and across those three it did not move at all.

      Two readings are open and the run did not separate them. Either the covering value
      at that side is at or above eighteen, in which case no certificate exists there;
      or the site sets are still short of it and the optimum is sitting on a degenerate
      vertex, which the collapse of pricing from 90 s to 1--3 s suggests -- a dual that
      sparse is what a degenerate basis looks like. Exactly round values are the known
      artefact signature in this pipeline, 18.0 having been one for n = 17's grid-31
      optima, so the second reading cannot be dismissed.

      What is not in doubt is the cost of settling it: two hours for the round that did
      not move. The run was stopped for that reason rather than for its answer, and the
      side is available to a later block with a cheaper decision path.

      The method's own ceiling is not close here. A certificate for n cannot exist above
      ceil(sqrt(n)) * B, a wider container holding ceil(sqrt(n))^2 pairwise disjoint
      axis-parallel B-squares whose masses Condition 5 forces past n; for n = 17 that is
      5B = 4.9885, so 459/100 still has 0.3985 of runway. Unlike n = 12, where the
      ceiling sits below the conjectured value and forecloses the case, nothing
      structural stops this one.

      Where the next rung is worth spending on, though, is not n = 17. Of the five
      conditions only Condition 2 mentions n, and the covering program behind the search does not
      contain n at all -- minimising total mass subject to every admissible B-square
      carrying mass at least 1 is a question about L, B and the net. So one atom set
      proves s(n) >= L for every integer n above its mass, this certificate's 16.933080
      reaching 17, 18 and 19 directly, and a larger n is strictly easier at the same side.

      The headroom said the rest, when this was written. n = 17 had 0.0855 to its best
      known packing at 4.675530; n = 18 had 0.2329 to 4.822876 and n = 19 had 0.2956 to
