# Temporary: rebuilds packing/devtools/suite-file-costs.json from the per-file cost
# reports of packing-validation run 37283814485, the last green pull-request cohort
# (PR 362, since merged into main), and commits it to the branch, for a session whose network cannot
# reach the artifact store. Removed in the next commit (think-92ar).
name: Temporary suite-cost record

on:
  push:
    branches: [claude/nifty-newton-o6kr0b]
    paths: [.github/workflows/tmp-suite-costs.yml]

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/nifty-newton-o6kr0b
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing

      - name: Synchronize the locked development environment
        working-directory: packing
        run: uv sync --frozen --all-extras --group dev

      - name: Download the shard timing artifacts of run 37283814485
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: 37283814485
          github-token: ${{ github.token }}
          pattern: validation-timings-suite-*
          path: ${{ runner.temp }}/reports

      - name: Rebuild the record from the four shard reports and check it
        working-directory: packing
        run: |
          find "$RUNNER_TEMP/reports" -name '*.test-files.json' | sort
          uv run --frozen --all-extras --group dev python -m devtools.suite_files record \
            --target-ceilings 131,154,154,131 \
            $(find "$RUNNER_TEMP/reports" -name '*.test-files.json' | sort)
          uv run --frozen --all-extras --group dev python -m devtools.suite_files check
          git diff --stat

      - name: Commit the record to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packing/devtools/suite-file-costs.json
          git commit -m "validation: rebuild the suite-file record from the four shards of run 37283814485 (think-92ar)" \
            -m "Shards 3/4 and 4/4 were over the 10% unrecorded share after this PR added five test files to the files main had added since the last rebuild. Rebuilt with devtools.suite_files record from the suite-a to suite-d per-file reports of run 37283814485, the last green pull-request cohort (PR 362, merged into main), at the 131/154/154/131 s ceilings; this PR's five files remain on the path hash until the next rebuild."
          git push origin HEAD:claude/nifty-newton-o6kr0b
